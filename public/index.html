const getLevelFromPoints = (points) => Math.floor(Math.sqrt(points / 50)) + 1;
const getPointsForNextLevel = (level) => Math.pow(level, 2) * 50;
const calculatePoints = (correct, streak, phaseId) => {
  const basePoints = correct * 10;
  const streakBonus = Math.floor(streak / 3) * 5;
  return (basePoints + streakBonus) * phaseId;
};
const getStarsForQuiz = (correct, total) => {
  const percentage = (correct / total) * 100;
  if (percentage >= 90) return 3;
  if (percentage >= 70) return 2;
  if (percentage >= 50) return 1;
  return 0;
};

const STORAGE_KEY = 'aprende_brincando_students';
const CURRENT_USER_KEY = 'aprende_brincando_current_user';

const loadStudents = () => {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  } catch { return []; }
};

const saveStudents = (students) => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
};

const loadCurrentUser = () => {
  try { return localStorage.getItem(CURRENT_USER_KEY); } catch { return null; }
};

const saveCurrentUser = (id) => {
  if (id) localStorage.setItem(CURRENT_USER_KEY, id);
  else localStorage.removeItem(CURRENT_USER_KEY);
};

function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function useStudents() {
  const [students, setStudents] = useState([]);
  const [currentStudentId, setCurrentStudentId] = useState(null);
  const [newTrophies, setNewTrophies] = useState([]);

  useEffect(() => {
    setStudents(loadStudents());
    setCurrentStudentId(loadCurrentUser());
  }, []);

  const currentStudent = students.find(s => s.id === currentStudentId) || null;

  const registerStudent = (name) => {
    const trimmedName = name.trim();
    if (!trimmedName) throw new Error('Nome é obrigatório');
    const existing = students.find(s => s.name.toLowerCase() === trimmedName.toLowerCase());
    if (existing) {
      setCurrentStudentId(existing.id);
      saveCurrentUser(existing.id);
      return existing;
    }
    const newStudent = {
      id: `student_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`,
      name: trimmedName,
      createdAt: Date.now(),
      totalPoints: 0,
      totalCorrect: 0,
      totalAnswered: 0,
      bestStreak: 0,
      trophies: [],
      stars: 0,
      level: 1,
      phaseProgress: {1: 0, 2: 0, 3: 0},
      subjectProgress: {},
      lastPlayed: Date.now(),
    };
    const updated = [...students, newStudent];
    setStudents(updated);
    saveStudents(updated);
    setCurrentStudentId(newStudent.id);
    saveCurrentUser(newStudent.id);
    return newStudent;
  };

  const selectStudent = (id) => {
    setCurrentStudentId(id);
    saveCurrentUser(id);
  };

  const logout = () => {
    setCurrentStudentId(null);
    saveCurrentUser(null);
  };

  const recordQuizResult = (subjectId, phaseId, correct, wrong, streak) => {
    if (!currentStudentId) return;
    const total = correct + wrong;
    const pointsEarned = calculatePoints(correct, streak, phaseId);
    const starsEarned = getStarsForQuiz(correct, total);
    const updatedStudents = students.map(s => {
      if (s.id !== currentStudentId) return s;
      const newStudent = {...s};
      newStudent.totalCorrect += correct;
      newStudent.totalAnswered += total;
      newStudent.totalPoints += pointsEarned;
      newStudent.bestStreak = Math.max(newStudent.bestStreak, streak);
      newStudent.stars += starsEarned;
      newStudent.level = getLevelFromPoints(newStudent.totalPoints);
      newStudent.lastPlayed = Date.now();
      newStudent.phaseProgress = {...newStudent.phaseProgress, [phaseId]: (newStudent.phaseProgress[phaseId] || 0) + 1};
      newStudent.subjectProgress = {...newStudent.subjectProgress, [subjectId]: (newStudent.subjectProgress[subjectId] || 0) + 1};
      const earnedTrophies = [];
      TROPHY_DEFINITIONS.forEach(def => {
        const alreadyHas = newStudent.trophies.some(t => t.id === def.id);
        if (!alreadyHas && def.req(newStudent)) {
          earnedTrophies.push({id: def.id, name: def.name, icon: def.icon, description: def.description, unlockedAt: Date.now(), tier: def.tier});
        }
      });
      if (earnedTrophies.length > 0) {
        newStudent.trophies = [...newStudent.trophies, ...earnedTrophies];
        setNewTrophies(earnedTrophies);
      }
      return newStudent;
    });
    setStudents(updatedStudents);
    saveStudents(updatedStudents);
    return {pointsEarned, starsEarned, currentStudent: updatedStudents.find(s => s.id === currentStudentId)};
  };

  const clearNewTrophies = () => setNewTrophies([]);
  const getRanking = () => [...students].sort((a, b) => b.totalPoints - a.totalPoints);

  return {students, currentStudent, currentStudentId, registerStudent, selectStudent, logout, recordQuizResult, getRanking, newTrophies, clearNewTrophies};
}

function App() {
  const {students, currentStudent, registerStudent, selectStudent, logout, recordQuizResult, getRanking, newTrophies, clearNewTrophies} = useStudents();
  const [gameState, setGameState] = useState('login');
  const [stats, setStats] = useState({correct:0,wrong:0,total:0,currentSubject:null,currentPhase:null});
  const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [showExplanation, setShowExplanation] = useState(false);
  const [shuffledQuestions, setShuffledQuestions] = useState([]);
  const [streak, setStreak] = useState(0);
  const [animateIn, setAnimateIn] = useState(false);
  const [selectedPhase, setSelectedPhase] = useState(null);
  const [nameInput, setNameInput] = useState('');
  const [loginError, setLoginError] = useState('');
  const [lastResult, setLastResult] = useState(null);

  useEffect(() => { setAnimateIn(true); }, [gameState, currentQuestionIndex]);
  useEffect(() => { if (currentStudent && gameState === 'login') navigateTo('menu'); }, []);

  const navigateTo = (state) => {
    setAnimateIn(false);
    setTimeout(() => { setGameState(state); setAnimateIn(true); }, 150);
  };

  const handleRegister = () => {
    setLoginError('');
    if (!nameInput.trim()) { setLoginError('Digite seu nome!'); return; }
    if (nameInput.trim().length < 2) { setLoginError('Nome muito curto!'); return; }
    try { registerStudent(nameInput); setNameInput(''); navigateTo('menu'); } catch (e) { setLoginError('Erro ao cadastrar'); }
  };

  const startQuiz = (subject, phase) => {
    const questions = questionsData[phase.id]?.[subject.id] || [];
    const shuffled = shuffleArray(questions);
    setShuffledQuestions(shuffled);
    setStats({correct:0,wrong:0,total:shuffled.length,currentSubject:subject,currentPhase:phase});
    setCurrentQuestionIndex(0);
    setSelectedAnswer(null);
    setShowExplanation(false);
    setStreak(0);
    setGameState('playing');
    setAnimateIn(false);
    setTimeout(() => setAnimateIn(true), 50);
  };

  const handleAnswer = (answerIndex) => {
    if (selectedAnswer !== null) return;
    setSelectedAnswer(answerIndex);
    setShowExplanation(true);
    const isCorrect = answerIndex === shuffledQuestions[currentQuestionIndex].correctAnswer;
    if (isCorrect) { setStats(prev => ({...prev, correct: prev.correct + 1})); setStreak(prev => prev + 1); }
    else { setStats(prev => ({...prev, wrong: prev.wrong + 1})); setStreak(0); }
  };

  const nextQuestion = () => {
    if (currentQuestionIndex + 1 >= shuffledQuestions.length) {
      const result = recordQuizResult(stats.currentSubject.id, stats.currentPhase.id, stats.correct, stats.wrong, streak);
      if (result) setLastResult({pointsEarned: result.pointsEarned, starsEarned: result.starsEarned});
      if (newTrophies.length > 0) navigateTo('trophy-celebration');
      else navigateTo('result');
    } else {
      setAnimateIn(false);
      setTimeout(() => { setCurrentQuestionIndex(prev => prev + 1); setSelectedAnswer(null); setShowExplanation(false); setAnimateIn(true); }, 200);
    }
  };

  const goToMenu = () => navigateTo('menu');
  const getScoreColor = () => { const p = (stats.correct / stats.total) * 100; if (p >= 80) return 'text-green-400'; if (p >= 60) return 'text-yellow-400'; return 'text-red-400'; };
  const getScoreEmoji = () => { const p = (stats.correct / stats.total) * 100; if (p >= 90) return '🏆'; if (p >= 80) return '🌟'; if (p >= 60) return '👍'; if (p >= 40) return '💪'; return '📚'; };
  const getScoreMessage = () => { const p = (stats.correct / stats.total) * 100; if (p >= 90) return 'Incrível! Você é um gênio!'; if (p >= 80) return 'Muito bem!'; if (p >= 60) return 'Bom trabalho!'; if (p >= 40) return 'Não desista!'; return 'Continue tentando!'; };
  const getRankPosition = (i) => { if (i === 0) return '🥇'; if (i === 1) return '🥈'; if (i === 2) return '🥉'; return `#${i + 1}`; };
  const getRankBg = (i, isCur) => { if (isCur) return 'bg-yellow-500/20 border-yellow-400/50'; if (i === 0) return 'bg-yellow-500/10 border-yellow-500/30'; if (i === 1) return 'bg-gray-400/10 border-gray-400/30'; if (i === 2) return 'bg-amber-600/10 border-amber-600/30'; return 'bg-white/5 border-white/10'; };

  // LOGIN
  if (gameState === 'login') {
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center justify-center p-4 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-md mx-auto text-center">
          <h1 className="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-cyan-300 mb-2">Aprende Brincando</h1>
          <p className="text-purple-200 mb-6">🎮 O jogo educativo mais divertido! 🎮</p>
          <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20 shadow-2xl">
            <div className="text-6xl mb-4">👋</div>
            <h2 className="text-xl font-bold text-white mb-2">Bem-vindo!</h2>
            <p className="text-purple-200 text-sm mb-6">Digite seu nome para começar!</p>
            <input type="text" value={nameInput} onChange={(e) => {setNameInput(e.target.value); setLoginError('');}} onKeyDown={(e) => e.key === 'Enter' && handleRegister()} placeholder="Seu nome..." maxLength={30} className="w-full bg-white/10 border-2 border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:border-yellow-400 mb-2" autoFocus />
            {loginError && <p className="text-red-400 text-sm mb-3">{loginError}</p>}
            <button onClick={handleRegister} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 font-bold py-3 rounded-xl shadow-lg hover:scale-105 transition-all active:scale-95 mt-2">🚀 Entrar e Jogar!</button>
            {students.length > 0 && <button onClick={() => navigateTo('select-student')} className="w-full bg-white/10 hover:bg-white/20 text-white font-medium py-3 rounded-xl border border-white/20 mt-3">👥 Entrar com perfil existente ({students.length})</button>}
          </div>
        </div>
      </div>
    );
  }

  // SELECT STUDENT
  if (gameState === 'select-student') {
    const ranking = getRanking();
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 pt-6 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-2xl mx-auto">
          <button onClick={() => navigateTo('login')} className="mb-3 text-purple-200 hover:text-white text-sm">← Voltar</button>
          <h2 className="text-2xl font-bold text-white text-center mb-2">Quem está jogando?</h2>
          <p className="text-purple-300 text-center mb-6 text-sm">Selecione seu perfil</p>
          <div className="grid gap-3">
            {ranking.map((student, index) => (
              <button key={student.id} onClick={() => {selectStudent(student.id); navigateTo('menu');}} className={`bg-white/10 hover:bg-white/20 border-2 rounded-xl p-4 flex items-center gap-3 transition-all active:scale-95 ${getRankBg(index, false)}`}>
                <div className="text-2xl">{getRankPosition(index)}</div>
                <div className="flex-1 min-w-0 text-left">
                  <p className="text-white font-bold truncate">{student.name}</p>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-yellow-300 text-xs">⭐ {student.totalPoints} pts</span>
                    <span className="text-purple-300 text-xs">🏆 Nível {student.level}</span>
                  </div>
                </div>
                <div className="text-xl">→</div>
              </button>
            ))}
          </div>
          <button onClick={() => navigateTo('login')} className="w-full mt-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 rounded-xl">➕ Cadastrar novo aluno</button>
        </div>
      </div>
    );
  }

  // MENU
  if (gameState === 'menu' && currentStudent) {
    const ranking = getRanking();
    const position = ranking.findIndex(s => s.id === currentStudent.id) + 1;
    const nextLevelPoints = getPointsForNextLevel(currentStudent.level + 1);
    const currentLevelPoints = getPointsForNextLevel(currentStudent.level);
    const progressToNext = ((currentStudent.totalPoints - currentLevelPoints) / (nextLevelPoints - currentLevelPoints)) * 100;
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-md mx-auto">
          <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-4 border border-white/20 shadow-2xl mb-4">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2 min-w-0 flex-1">
                <div className="w-12 h-12 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-xl font-bold text-white">{currentStudent.name.charAt(0).toUpperCase()}</div>
                <div className="min-w-0 flex-1">
                  <p className="text-white font-bold text-sm truncate">Olá, {currentStudent.name}!</p>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-yellow-300 text-xs">🏆 Nível {currentStudent.level}</span>
                    <span className="text-cyan-300 text-xs">🌟 {currentStudent.stars}</span>
                    <span className="text-purple-300 text-xs">🏅 #{position}</span>
                  </div>
                </div>
              </div>
              <button onClick={() => navigateTo('profile')} className="bg-white/10 hover:bg-white/20 p-2 rounded-lg"><span className="text-lg">⚙️</span></button>
            </div>
            <div className="bg-white/10 rounded-full h-2 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-yellow-400 to-orange-500 transition-all duration-500" style={{width: `${Math.min(100, progressToNext)}%`}}></div>
            </div>
            <p className="text-purple-200 text-xs mt-1 text-right">{currentStudent.totalPoints} / {nextLevelPoints} pts</p>
          </div>
          <div className="grid gap-3">
            <button onClick={() => navigateTo('phase-select')} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 font-bold text-xl py-4 rounded-xl shadow-lg hover:scale-[1.02] transition-all active:scale-95">🚀 Jogar Agora!</button>
            <div className="grid grid-cols-2 gap-3">
              <button onClick={() => navigateTo('ranking')} className="bg-gradient-to-br from-purple-500 to-pink-600 text-white font-bold py-4 rounded-xl shadow-lg hover:scale-[1.02] transition-all active:scale-95">
                <div className="text-2xl mb-1">🏆</div><div className="text-sm">Ranking</div>
              </button>
              <button onClick={() => navigateTo('profile')} className="bg-gradient-to-br from-cyan-500 to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:scale-[1.02] transition-all active:scale-95">
                <div className="text-2xl mb-1">👤</div><div className="text-sm">Meu Perfil</div>
              </button>
            </div>
          </div>
          {ranking.length > 0 && (
            <div className="mt-4 bg-gradient-to-br from-purple-600/20 to-pink-600/20 rounded-2xl p-4 border-2 border-yellow-400/30 shadow-xl">
              <h3 className="text-white font-bold text-sm mb-3 text-center flex items-center justify-center gap-2"><span className="text-xl">🏆</span><span>Melhores Alunos</span><span className="text-xl">🏆</span></h3>
              {ranking.length >= 3 && (
                <div className="flex items-end justify-center gap-2 mb-3">
                  <div className="flex-1 flex flex-col items-center">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-br from-gray-300 to-gray-500 flex items-center justify-center text-lg font-bold text-white mb-1 border-2 border-gray-400">{ranking[1].name.charAt(0).toUpperCase()}</div>
                    <p className="text-white/90 text-xs font-semibold truncate w-full text-center">{ranking[1].name}</p>
                    <div className="bg-gray-400/30 rounded-lg px-2 py-1 mt-1 w-full text-center"><p className="text-gray-200 text-sm font-bold">{ranking[1].totalPoints}</p><p className="text-gray-300 text-[9px]">pontos</p></div>
                    <div className="text-2xl mt-1">🥈</div>
                  </div>
                  <div className="flex-1 flex flex-col items-center">
                    <div className="w-14 h-14 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-xl font-bold text-white mb-1 border-2 border-yellow-300 shadow-lg shadow-yellow-500/50">{ranking[0].name.charAt(0).toUpperCase()}</div>
                    <p className={`text-xs font-bold truncate w-full text-center ${ranking[0].id === currentStudent.id ? 'text-yellow-300' : 'text-white'}`}>{ranking[0].name} {ranking[0].id === currentStudent.id && '⭐'}</p>
                    <div className="bg-yellow-500/40 rounded-lg px-2 py-1 mt-1 w-full text-center border border-yellow-400/50"><p className="text-yellow-200 text-base font-bold">{ranking[0].totalPoints}</p><p className="text-yellow-300 text-[9px]">pontos</p></div>
                    <div className="text-3xl mt-1">🥇</div>
                  </div>
                  <div className="flex-1 flex flex-col items-center">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-br from-amber-600 to-amber-800 flex items-center justify-center text-lg font-bold text-white mb-1 border-2 border-amber-500">{ranking[2].name.charAt(0).toUpperCase()}</div>
                    <p className="text-white/90 text-xs font-semibold truncate w-full text-center">{ranking[2].name}</p>
                    <div className="bg-amber-600/30 rounded-lg px-2 py-1 mt-1 w-full text-center"><p className="text-amber-200 text-sm font-bold">{ranking[2].totalPoints}</p><p className="text-amber-300 text-[9px]">pontos</p></div>
                    <div className="text-2xl mt-1">🥉</div>
                  </div>
                </div>
              )}
              {ranking.length > 3 && (
                <div className="space-y-1.5 mt-3 pt-3 border-t border-white/10">
                  {ranking.slice(3, 5).map((student, idx) => (
                    <div key={student.id} className={`flex items-center gap-2 p-2 rounded-lg ${student.id === currentStudent.id ? 'bg-yellow-500/20 border border-yellow-400/30' : 'bg-white/5'}`}>
                      <span className="text-white/60 text-xs font-bold w-6">#{idx + 4}</span>
                      <div className="w-7 h-7 rounded-full bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-xs font-bold text-white">{student.name.charAt(0).toUpperCase()}</div>
                      <span className={`flex-1 text-xs truncate ${student.id === currentStudent.id ? 'text-yellow-300 font-bold' : 'text-white/80'}`}>{student.name} {student.id === currentStudent.id && '(você)'}</span>
                      <div className="text-right"><span className="text-yellow-300 text-xs font-bold">{student.totalPoints}</span><p className="text-white/40 text-[9px]">pontos</p></div>
                    </div>
                  ))}
                </div>
              )}
              {ranking.length > 0 && (
                <div className="mt-3 text-center">
                  <p className="text-purple-200 text-xs">{currentStudent.id === ranking[0]?.id ? '🌟 Parabéns! Você é o líder!' : position <= 5 ? `🔥 Você está em ${position}º! Continue!` : '💪 Jogue mais para entrar no Top 5!'}</p>
                </div>
              )}
            </div>
          )}
          <button onClick={logout} className="w-full mt-4 text-purple-300 hover:text-white text-xs py-2">🚪 Trocar de aluno</button>
        </div>
      </div>
    );
  }

  // PHASE SELECT
  if (gameState === 'phase-select') {
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 pt-6 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-2xl mx-auto">
          <button onClick={goToMenu} className="mb-3 text-purple-200 hover:text-white text-sm">← Voltar</button>
          <h2 className="text-2xl font-bold text-white text-center mb-2">Escolha a Fase</h2>
          <p className="text-purple-300 text-center mb-6 text-sm">Selecione o nível</p>
          <div className="grid grid-cols-1 gap-3">
            {phases.map((phase) => (
              <button key={phase.id} onClick={() => {setSelectedPhase(phase); navigateTo('subject-select');}} className={`bg-gradient-to-r ${phase.color} p-4 rounded-2xl shadow-lg hover:scale-[1.02] transition-all active:scale-95 text-left`}>
                <div className="flex items-center gap-3">
                  <span className="text-4xl">{phase.icon}</span>
                  <div className="flex-1">
                    <h3 className="text-lg font-bold text-white">{phase.name}</h3>
                    <p className="text-white/80 text-sm">{phase.description}</p>
                    <span className={`inline-block mt-1 text-xs px-2 py-0.5 rounded-full ${phase.difficulty === 'Fácil' ? 'bg-green-400/30 text-green-100' : phase.difficulty === 'Médio' ? 'bg-yellow-400/30 text-yellow-100' : 'bg-red-400/30 text-red-100'}`}>{phase.difficulty}</span>
                  </div>
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // SUBJECT SELECT
  if (gameState === 'subject-select' && selectedPhase) {
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 pt-6 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-2xl mx-auto">
          <button onClick={() => navigateTo('phase-select')} className="mb-3 text-purple-200 hover:text-white text-sm">← Voltar</button>
          <div className="text-center mb-4">
            <span className="text-3xl">{selectedPhase.icon}</span>
            <h2 className="text-2xl font-bold text-white mt-2">{selectedPhase.name}</h2>
            <p className="text-purple-300 text-sm">Escolha a matéria</p>
          </div>
          <div className="grid grid-cols-2 gap-3">
            {subjects.map((subject) => {
              const questions = questionsData[selectedPhase.id]?.[subject.id] || [];
              return (
                <button key={subject.id} onClick={() => startQuiz(subject, selectedPhase)} className={`bg-gradient-to-br ${subject.color} p-4 rounded-2xl shadow-lg hover:scale-105 transition-all active:scale-95 text-left`}>
                  <span className="text-3xl mb-1 block">{subject.icon}</span>
                  <h3 className="text-sm font-bold text-white">{subject.name}</h3>
                  <p className="text-white/70 text-xs">{questions.length} questões</p>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // PLAYING
  if (gameState === 'playing' && stats.currentSubject && stats.currentPhase) {
    const currentQuestion = shuffledQuestions[currentQuestionIndex];
    const progress = ((currentQuestionIndex + 1) / shuffledQuestions.length) * 100;
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 pt-4 transition-opacity duration-300 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-2xl mx-auto">
          <div className="flex items-center justify-between mb-3">
            <button onClick={goToMenu} className="text-purple-200 hover:text-white text-sm">← Sair</button>
            <div className="flex items-center gap-2">
              {streak >= 3 && <span className="bg-orange-500/30 text-orange-300 px-2 py-0.5 rounded-full text-xs font-bold animate-pulse">🔥 {streak}</span>}
              <span className="text-purple-200 text-sm">{currentQuestionIndex + 1}/{shuffledQuestions.length}</span>
            </div>
          </div>
          <div className="w-full bg-white/10 rounded-full h-2.5 mb-3 overflow-hidden">
            <div className={`h-full rounded-full bg-gradient-to-r ${stats.currentSubject.color} transition-all duration-500`} style={{width: `${progress}%`}}></div>
          </div>
          <div className="flex items-center justify-between mb-3 gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <span className="text-xl">{stats.currentSubject.icon}</span>
              <span className="text-white/80 text-sm">{stats.currentSubject.name}</span>
            </div>
            <div className="flex items-center gap-1 bg-white/10 px-2 py-0.5 rounded-full">
              <span className="text-sm">{stats.currentPhase.icon}</span>
              <span className="text-white/70 text-xs">{stats.currentPhase.name}</span>
            </div>
          </div>
          <div className="flex gap-2 mb-3">
            <span className="bg-green-500/20 text-green-300 px-2 py-0.5 rounded-full text-xs">✓ {stats.correct}</span>
            <span className="bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full text-xs">✗ {stats.wrong}</span>
          </div>
          <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-4 border border-white/20 shadow-2xl mb-3">
            <h3 className="text-lg font-bold text-white mb-4">{currentQuestion.question}</h3>
            <div className="grid gap-2">
              {currentQuestion.options.map((option, index) => {
                let buttonClass = 'bg-white/5 border-white/20 text-white';
                if (selectedAnswer !== null) {
                  if (index === currentQuestion.correctAnswer) buttonClass = 'bg-green-500/30 border-green-400 text-green-100 ring-2 ring-green-400/50';
                  else if (index === selectedAnswer && index !== currentQuestion.correctAnswer) buttonClass = 'bg-red-500/30 border-red-400 text-red-100 ring-2 ring-red-400/50';
                  else buttonClass = 'bg-white/5 border-white/10 text-white/50';
                }
                return (
                  <button key={index} onClick={() => handleAnswer(index)} disabled={selectedAnswer !== null} className={`w-full text-left p-3 rounded-xl border-2 transition-all active:scale-[0.98] ${buttonClass} ${selectedAnswer === null ? 'cursor-pointer' : 'cursor-default'}`}>
                    <span className="flex items-center gap-2">
                      <span className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-xs font-bold">{String.fromCharCode(65 + index)}</span>
                      <span className="font-medium text-sm break-words flex-1">{option}</span>
                      {selectedAnswer !== null && index === currentQuestion.correctAnswer && <span className="text-green-400 text-lg">✓</span>}
                      {selectedAnswer === index && index !== currentQuestion.correctAnswer && <span className="text-red-400 text-lg">✗</span>}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
          {showExplanation && (
            <div className={`rounded-xl p-3 mb-3 border ${selectedAnswer === currentQuestion.correctAnswer ? 'bg-green-500/10 border-green-500/30' : 'bg-red-500/10 border-red-500/30'}`}>
              <p className={`font-medium text-sm ${selectedAnswer === currentQuestion.correctAnswer ? 'text-green-300' : 'text-red-300'}`}>{selectedAnswer === currentQuestion.correctAnswer ? '🎉 Correto!' : '❌ Incorreto!'}</p>
              <p className="text-white/80 text-xs mt-1">💡 {currentQuestion.explanation}</p>
            </div>
          )}
          {selectedAnswer !== null && (
            <button onClick={nextQuestion} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all">
              {currentQuestionIndex + 1 >= shuffledQuestions.length ? '🏁 Ver Resultado' : '→ Próxima Questão'}
            </button>
          )}
        </div>
      </div>
    );
  }

  // TROPHY CELEBRATION
  if (gameState === 'trophy-celebration' && newTrophies.length > 0) {
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center justify-center p-4 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-md mx-auto text-center">
          <div className="text-6xl mb-4 animate-bounce">🎊</div>
          <h2 className="text-2xl font-bold text-white mb-2">Novos Troféus!</h2>
          <p className="text-purple-200 text-sm mb-6">Você conquistou:</p>
          <div className="space-y-3 mb-6">
            {newTrophies.map((trophy) => (
              <div key={trophy.id} className={`bg-gradient-to-r ${getTierColor(trophy.tier)} p-[2px] rounded-2xl`}>
                <div className="bg-indigo-900/90 rounded-2xl p-4 flex items-center gap-3">
                  <div className="text-4xl">{trophy.icon}</div>
                  <div className="text-left flex-1 min-w-0">
                    <p className="text-white font-bold truncate">{trophy.name}</p>
                    <p className="text-white/70 text-xs">{trophy.description}</p>
                    <p className="text-yellow-300 text-xs mt-1 uppercase">{trophy.tier}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <button onClick={() => {clearNewTrophies(); navigateTo('result');}} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 font-bold py-3 rounded-xl active:scale-95 transition-all">✨ Continuar</button>
        </div>
      </div>
    );
  }

  // RESULT
  if (gameState === 'result') {
    const percentage = Math.round((stats.correct / stats.total) * 100);
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center justify-center p-4 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-lg mx-auto text-center">
          <div className="text-6xl mb-3 animate-bounce">{getScoreEmoji()}</div>
          <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-4 border border-white/20 shadow-2xl mb-4">
            <h2 className="text-xl font-bold text-white mb-2">Resultado Final</h2>
            {lastResult && (
              <div className="bg-gradient-to-r from-yellow-500/20 to-orange-500/20 border border-yellow-400/30 rounded-xl p-3 mb-4">
                <div className="flex justify-around items-center">
                  <div><p className="text-yellow-300 text-2xl font-bold">+{lastResult.pointsEarned}</p><p className="text-white/60 text-xs">pontos</p></div>
                  <div className="text-2xl">⭐</div>
                  <div><p className="text-cyan-300 text-2xl font-bold">+{lastResult.starsEarned}</p><p className="text-white/60 text-xs">estrelas</p></div>
                </div>
              </div>
            )}
            <div className="relative w-32 h-32 mx-auto mb-4">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="8" />
                <circle cx="50" cy="50" r="45" fill="none" stroke={percentage >= 80 ? '#4ade80' : percentage >= 60 ? '#facc15' : '#f87171'} strokeWidth="8" strokeLinecap="round" strokeDasharray={`${percentage * 2.83} 283`} className="transition-all duration-1000" />
              </svg>
              <div className="absolute inset-0 flex items-center justify-center"><span className={`text-3xl font-bold ${getScoreColor()}`}>{percentage}%</span></div>
            </div>
            <p className="text-base text-white font-medium mb-3">{getScoreMessage()}</p>
            <div className="grid grid-cols-3 gap-2">
              <div className="bg-white/5 rounded-xl p-2"><p className="text-xl font-bold text-green-400">{stats.correct}</p><p className="text-xs text-white/60">Acertos</p></div>
              <div className="bg-white/5 rounded-xl p-2"><p className="text-xl font-bold text-red-400">{stats.wrong}</p><p className="text-xs text-white/60">Erros</p></div>
              <div className="bg-white/5 rounded-xl p-2"><p className="text-xl font-bold text-yellow-400">{stats.total}</p><p className="text-xs text-white/60">Total</p></div>
            </div>
          </div>
          <div className="grid grid-cols-1 gap-2">
            <button onClick={() => startQuiz(stats.currentSubject, stats.currentPhase)} className="bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 rounded-xl active:scale-95 transition-all">🔄 Jogar Novamente</button>
            <button onClick={() => navigateTo('subject-select')} className="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 rounded-xl active:scale-95 transition-all">📚 Outra Matéria</button>
            <button onClick={goToMenu} className="bg-white/10 hover:bg-white/20 text-white font-medium py-2.5 rounded-xl border border-white/20 transition-all">🏠 Menu Principal</button>
          </div>
        </div>
      </div>
    );
  }

  // RANKING
  if (gameState === 'ranking' && currentStudent) {
    const ranking = getRanking();
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 pt-6 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-2xl mx-auto">
          <button onClick={goToMenu} className="mb-3 text-purple-200 hover:text-white text-sm">← Voltar</button>
          <h2 className="text-2xl font-bold text-white text-center mb-2">🏆 Ranking Geral</h2>
          <p className="text-purple-300 text-center mb-4 text-sm">Quem é o melhor aluno?</p>
          {ranking.length === 0 && <div className="bg-white/10 rounded-xl p-6 text-center"><p className="text-white">Nenhum aluno cadastrado!</p></div>}
          <div className="space-y-2">
            {ranking.map((student, index) => {
              const isCurrentUser = student.id === currentStudent.id;
              return (
                <div key={student.id} className={`border-2 rounded-xl p-3 ${getRankBg(index, isCurrentUser)}`}>
                  <div className="flex items-center gap-3">
                    <div className="text-2xl w-10 text-center">{getRankPosition(index)}</div>
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-sm font-bold text-white">{student.name.charAt(0).toUpperCase()}</div>
                    <div className="flex-1 min-w-0">
                      <p className={`font-bold text-sm truncate ${isCurrentUser ? 'text-yellow-300' : 'text-white'}`}>{student.name} {isCurrentUser && <span className="text-xs">(você)</span>}</p>
                      <div className="flex items-center gap-2 flex-wrap text-xs">
                        <span className="text-purple-300">🏆 Nível {student.level}</span>
                        <span className="text-cyan-300">🌟 {student.stars}</span>
                        <span className="text-green-300">✓ {student.totalCorrect}</span>
                      </div>
                    </div>
                    <div className="text-right"><p className="text-yellow-300 font-bold">{student.totalPoints}</p><p className="text-white/50 text-xs">pontos</p></div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // PROFILE
  if (gameState === 'profile' && currentStudent) {
    const ranking = getRanking();
    const position = ranking.findIndex(s => s.id === currentStudent.id) + 1;
    const nextLevelPoints = getPointsForNextLevel(currentStudent.level + 1);
    const currentLevelPoints = getPointsForNextLevel(currentStudent.level);
    const progressToNext = ((currentStudent.totalPoints - currentLevelPoints) / (nextLevelPoints - currentLevelPoints)) * 100;
    const accuracy = currentStudent.totalAnswered > 0 ? Math.round((currentStudent.totalCorrect / currentStudent.totalAnswered) * 100) : 0;
    return (
      <div className={`min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex flex-col items-center p-4 pt-6 transition-opacity duration-500 ${animateIn ? 'opacity-100' : 'opacity-0'}`}>
        <div className="w-full max-w-2xl mx-auto">
          <button onClick={goToMenu} className="mb-3 text-purple-200 hover:text-white text-sm">← Voltar</button>
          <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-4 border border-white/20 shadow-2xl mb-4">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-16 h-16 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-2xl font-bold text-white">{currentStudent.name.charAt(0).toUpperCase()}</div>
              <div className="flex-1 min-w-0">
                <h2 className="text-lg font-bold text-white truncate">{currentStudent.name}</h2>
                <p className="text-purple-200 text-xs">🏆 Nível {currentStudent.level} • 🏅 #{position} no ranking</p>
              </div>
            </div>
            <div className="bg-white/10 rounded-full h-3 overflow-hidden mb-1">
              <div className="h-full bg-gradient-to-r from-yellow-400 to-orange-500 transition-all duration-500" style={{width: `${Math.min(100, progressToNext)}%`}}></div>
            </div>
            <p className="text-purple-200 text-xs text-right">{currentStudent.totalPoints} / {nextLevelPoints} pts</p>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
            <div className="bg-white/10 rounded-xl p-3 text-center border border-white/10"><p className="text-xl font-bold text-yellow-300">{currentStudent.totalPoints}</p><p className="text-xs text-white/60">Pontos</p></div>
            <div className="bg-white/10 rounded-xl p-3 text-center border border-white/10"><p className="text-xl font-bold text-cyan-300">{currentStudent.stars}</p><p className="text-xs text-white/60">Estrelas</p></div>
            <div className="bg-white/10 rounded-xl p-3 text-center border border-white/10"><p className="text-xl font-bold text-green-300">{accuracy}%</p><p className="text-xs text-white/60">Precisão</p></div>
            <div className="bg-white/10 rounded-xl p-3 text-center border border-white/10"><p className="text-xl font-bold text-orange-300">🔥 {currentStudent.bestStreak}</p><p className="text-xs text-white/60">Melhor seq.</p></div>
          </div>
          <div className="bg-white/10 rounded-2xl p-4 border border-white/10 mb-4">
            <h3 className="text-white font-bold mb-3">🏆 Troféus ({currentStudent.trophies.length}/{TROPHY_DEFINITIONS.length})</h3>
            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
              {TROPHY_DEFINITIONS.map((def) => {
                const unlocked = currentStudent.trophies.find(t => t.id === def.id);
                return (
                  <div key={def.id} className={`relative rounded-xl p-2 text-center border-2 ${unlocked ? `${getTierBorder(def.tier)} bg-white/10` : 'border-white/10 bg-white/5 opacity-50'}`}>
                    <div className={`text-2xl mb-1 ${unlocked ? '' : 'grayscale'}`}>{def.icon}</div>
                    <p className="text-[10px] text-white/80 leading-tight truncate">{unlocked ? def.name : '???'}</p>
                    {unlocked && <div className={`absolute top-0 right-0 bg-gradient-to-r ${getTierColor(def.tier)} text-white text-[8px] px-1 rounded-bl rounded-tr-lg`}>{def.tier.toUpperCase()}</div>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => navigateTo('ranking')} className="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 rounded-xl active:scale-95 transition-all text-sm">🏆 Ver Ranking</button>
            <button onClick={logout} className="bg-white/10 hover:bg-white/20 text-white font-medium py-3 rounded-xl border border-white/20 transition-all text-sm">🚪 Trocar de Aluno</button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
